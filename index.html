<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Bootstrap Page</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Header / Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">My Website</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
                
            </ul>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container my-5">
    <div class="row g-4">
        <div class="col-md-3 col-sm-6">
            <img src="./img/aloo_tikki_burger.jpg" class="img-fluid rounded" alt="Image 1">
        </div>
        <div class="col-md-3 col-sm-6">
            <img src="./img/butter_paneer_burger.jpg" class="img-fluid rounded" alt="Image 2">
        </div>
        <div class="col-md-3 col-sm-6">
            <img src="./img/grilled_veg_sandwich.jpg" class="img-fluid rounded" alt="Image 3">
        </div>
        <div class="col-md-3 col-sm-6">
            <img src="./img/spicy_paneer_burger.jpg" class="img-fluid rounded" alt="Image 4">
        </div>

       
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
